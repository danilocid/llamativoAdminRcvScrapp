steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/llamativo-rcv-scrapper:$COMMIT_SHA', '.']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/llamativo-rcv-scrapper:$COMMIT_SHA']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'llamativo-rcv-scrapper'
      - '--image'
      - 'gcr.io/$PROJECT_ID/llamativo-rcv-scrapper:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--concurrency'
      - '1'
      - '--memory'
      - '4Gi'
      - '--timeout'
      - '600'

images:
  - 'gcr.io/$PROJECT_ID/llamativo-rcv-scrapper:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
